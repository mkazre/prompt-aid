---
# cPanel → Git Version Control → Manage → "Pull or Deploy" → "Deploy HEAD Commit"
# runs these tasks from this repository's folder on the server. Everything
# the deploy does (backup, copy, migrate, caches) is in deploy/cpanel-deploy.sh
# and logged to ~/promptaid-deploy.log (open it in File Manager).
deployment:
  tasks:
    - /bin/bash deploy/cpanel-deploy.sh
